
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Campus Lost & Found</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <main class="form-container">
        <h2>Create Student Account</h2>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
                minlength="3"
                maxlength="50"
                pattern="[A-Za-z ]{3,50}"
                title="Enter a name containing at least 3 letters."
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
                minlength="6"
                maxlength="72"
                title="Password must contain at least 6 characters."
            >

            <button type="submit">Register</button>
        </form>

        <p id="registerMessage" role="status" aria-live="polite"></p>

        <p>
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
